name: Verify and deploy Azure test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build, test, and validate deployment
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.27.0
          cache-dependency-path: auth-gateway/go.sum

      - name: Restore
        run: dotnet restore PopulationDataFacade.slnx --locked-mode

      - name: Enforce dependency vulnerability policy
        shell: pwsh
        run: |
          ./scripts/check-nuget-vulnerabilities.ps1
          ./scripts/check-nuget-deprecations.ps1

      - name: Enforce dependency license policy
        shell: pwsh
        run: |
          ./scripts/check-licenses.ps1
          ./scripts/check-go-licenses.ps1

      - name: Build
        run: dotnet build PopulationDataFacade.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test PopulationDataFacade.slnx --configuration Release --no-build

      - name: Test authentication gateway
        working-directory: auth-gateway
        run: |
          go mod verify
          go test -race ./...
          go vet ./...

      - name: Check authentication gateway vulnerabilities
        working-directory: auth-gateway
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Compile Bicep templates
        run: |
          az bicep build --file infra/foundation.bicep --outfile "$RUNNER_TEMP/foundation.json"
          az bicep build --file infra/app.bicep --outfile "$RUNNER_TEMP/app.json"
          pwsh ./scripts/check-container-topology.ps1 -CompiledTemplate "$RUNNER_TEMP/app.json"

      - name: Build container images
        run: |
          docker build --tag fhir-gravid-api:verify .
          docker build --file auth-gateway/Dockerfile --tag fhir-gravid-auth-gateway:verify .

      - name: Smoke test the two-container topology
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            docker rm --force fhir-gravid-auth-gateway-smoke fhir-gravid-api-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          private_jwk="$(node -e 'const {generateKeyPairSync}=require("node:crypto");const {privateKey}=generateKeyPairSync("rsa",{modulusLength:2048});const jwk=privateKey.export({format:"jwk"});jwk.alg="PS256";jwk.kid="container-smoke";process.stdout.write(JSON.stringify(jwk))')"
          docker run --detach --name fhir-gravid-api-smoke --publish 18080:8080 \
            --env ASPNETCORE_ENVIRONMENT=Staging \
            --env DevelopmentTestMode__Enabled=true \
            --env DevelopmentTestMode__AllowRemoteStaging=true \
            --env Dhg__Environment=Test \
            --env HelseId__ClientId=container-smoke \
            --env HelseId__ClientAssertionJwk="$private_jwk" \
            --env HelseId__DPoPJwk="$private_jwk" \
            fhir-gravid-api:verify
          docker run --detach --name fhir-gravid-auth-gateway-smoke \
            --network container:fhir-gravid-api-smoke \
            --env AUTH_GATEWAY_MODE=passthrough \
            --env AUTH_GATEWAY_EXTERNAL_SCHEME=http \
            fhir-gravid-auth-gateway:verify
          unset private_jwk

          test "$(docker inspect --format '{{.Config.User}}' fhir-gravid-api-smoke)" != ""
          test "$(docker inspect --format '{{.Config.User}}' fhir-gravid-api-smoke)" != "0"
          test "$(docker inspect --format '{{.Config.User}}' fhir-gravid-auth-gateway-smoke)" = "65532:65532"
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:18080/health/ready >/dev/null; then
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              docker logs fhir-gravid-api-smoke
              docker logs fhir-gravid-auth-gateway-smoke
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:18080/fhir/metadata \
            | jq --exit-status '.resourceType == "CapabilityStatement"' >/dev/null

  deploy-test:
    name: Deploy immutable image to Azure test
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: azure-test
    concurrency:
      group: fhir-gravid-azure-test
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_NAME_PREFIX: ${{ vars.AZURE_NAME_PREFIX }}
      AZURE_CONTAINER_REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}
      AZURE_CONTAINERAPPS_ENVIRONMENT: ${{ vars.AZURE_CONTAINERAPPS_ENVIRONMENT }}
      AZURE_PULL_IDENTITY: ${{ vars.AZURE_PULL_IDENTITY }}
      AZURE_ALLOWED_IP_CIDR: ${{ vars.AZURE_ALLOWED_IP_CIDR }}
      DHG_BASE_URL: ${{ vars.DHG_BASE_URL }}
      HELSEID_AUTHORITY: ${{ vars.HELSEID_AUTHORITY }}
      HELSEID_CLIENT_ID: ${{ vars.HELSEID_CLIENT_ID }}
      PATIENT_TEST_LOGICAL_ID: ${{ vars.PATIENT_TEST_LOGICAL_ID }}
      HELSEID_CLIENT_ASSERTION_JWK_B64: ${{ secrets.HELSEID_CLIENT_ASSERTION_JWK_B64 }}
      HELSEID_DPOP_JWK_B64: ${{ secrets.HELSEID_DPOP_JWK_B64 }}
      PATIENT_TEST_NIN: ${{ secrets.PATIENT_TEST_NIN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate required GitHub environment configuration
        shell: bash
        run: |
          set -euo pipefail
          required=(
            AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID
            AZURE_RESOURCE_GROUP AZURE_LOCATION AZURE_NAME_PREFIX AZURE_CONTAINER_REGISTRY
            AZURE_CONTAINERAPPS_ENVIRONMENT AZURE_PULL_IDENTITY AZURE_ALLOWED_IP_CIDR
            DHG_BASE_URL HELSEID_AUTHORITY HELSEID_CLIENT_ID
            PATIENT_TEST_LOGICAL_ID HELSEID_CLIENT_ASSERTION_JWK_B64
            HELSEID_DPOP_JWK_B64 PATIENT_TEST_NIN
          )
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing azure-test variables/secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          if [[ "$AZURE_ALLOWED_IP_CIDR" == "0.0.0.0/0" || "$AZURE_ALLOWED_IP_CIDR" == "::/0" ]]; then
            printf 'AZURE_ALLOWED_IP_CIDR must identify a controlled test network, not the entire internet.\n' >&2
            exit 1
          fi

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push immutable images
        shell: bash
        run: |
          set -euo pipefail
          api_image="${AZURE_CONTAINER_REGISTRY}.azurecr.io/fhir-gravid-api:${GITHUB_SHA}"
          gateway_image="${AZURE_CONTAINER_REGISTRY}.azurecr.io/fhir-gravid-auth-gateway:${GITHUB_SHA}"
          az acr login --name "$AZURE_CONTAINER_REGISTRY"
          docker build --tag "$api_image" .
          docker build --file auth-gateway/Dockerfile --tag "$gateway_image" .
          docker push "$api_image"
          docker push "$gateway_image"

      - name: Deploy Container App without Key Vault
        shell: bash
        run: |
          set -euo pipefail
          client_assertion_jwk="$(printf '%s' "$HELSEID_CLIENT_ASSERTION_JWK_B64" | base64 --decode | jq -ce 'if type == "object" then . else error("JWK must be a JSON object") end')"
          dpop_jwk="$(printf '%s' "$HELSEID_DPOP_JWK_B64" | base64 --decode | jq -ce 'if type == "object" then . else error("JWK must be a JSON object") end')"
          echo "::add-mask::$client_assertion_jwk"
          echo "::add-mask::$dpop_jwk"

          deployment_name="fhir-gravid-app-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          az deployment group create \
            --name "$deployment_name" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/app.bicep \
            --parameters \
              namePrefix="$AZURE_NAME_PREFIX" \
              location="$AZURE_LOCATION" \
              registryName="$AZURE_CONTAINER_REGISTRY" \
              environmentName="$AZURE_CONTAINERAPPS_ENVIRONMENT" \
              pullIdentityName="$AZURE_PULL_IDENTITY" \
              imageTag="$GITHUB_SHA" \
              revisionSuffix="r${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              dhgBaseUrl="$DHG_BASE_URL" \
              helseIdAuthority="$HELSEID_AUTHORITY" \
              helseIdClientId="$HELSEID_CLIENT_ID" \
              patientTestLogicalId="$PATIENT_TEST_LOGICAL_ID" \
              allowedIpCidr="$AZURE_ALLOWED_IP_CIDR" \
              clientAssertionJwk="$client_assertion_jwk" \
              dpopJwk="$dpop_jwk" \
              patientTestNin="$PATIENT_TEST_NIN" \
            --output none

          application_url="$(az deployment group show \
            --name "$deployment_name" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.outputs.applicationUrl.value \
            --output tsv)"
          printf 'APPLICATION_URL=%s\n' "$application_url" >> "$GITHUB_ENV"
          printf 'Deployed %s\n' "$application_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Record restricted-ingress verification note
        shell: bash
        run: |
          printf 'External smoke tests were skipped because ingress is restricted to `%s`. Verify `/health/live`, `/health/ready`, and `/swagger/v1/swagger.json` from that network.\n' \
            "$AZURE_ALLOWED_IP_CIDR" >> "$GITHUB_STEP_SUMMARY"
